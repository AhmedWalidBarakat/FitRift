# Visits the backend once a day so the free hosting never goes idle for long.
# /exercises reads from the database, which counts as activity for Supabase,
# so the free project is never paused for a week without traffic.
name: Keep alive

on:
  schedule:
    - cron: "0 12 * * *" # every day at 12:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the backend and touch the database
        # Render's free plan can take up to a minute to wake, hence the long timeout and retries
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors https://fitrift.onrender.com/exercises -o /dev/null
