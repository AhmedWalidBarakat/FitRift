# Keeps both free Supabase projects busy so neither is paused after a week without traffic.
# FitRift uses one project for the database and another for logins (Guest Mode, Sign In),
# so the job touches each of them once a day. A failed run emails a heads-up.
name: Keep alive

on:
  schedule:
    - cron: "0 12 * * *" # every day at 12:00 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Database project (via the backend)
        # /exercises reads from the database. Render's free plan can take up to a minute
        # to wake, hence the long timeout and retries.
        run: curl --fail --silent --show-error --max-time 120 --retry 3 --retry-delay 20 --retry-all-errors https://fitrift.onrender.com/exercises -o /dev/null

      - name: Login project
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for path in auth/v1/health auth/v1/settings; do
            curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
              -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
              "https://xebxkitzfsvqejyiiiec.supabase.co/$path" -o /dev/null
          done
